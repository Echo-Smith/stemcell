<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf1" />
    <meta name="robots" content="noindex" />
    <title>页面走丢了 · eric的开发日记</title>
    <meta name="description" content="没有找到这一页，回到 eric的开发日记继续看看吧。" />
    <style>
      :root {
        color-scheme: light;
        --milk-paper: #fffaf1;
        --clean-paper: #fffefb;
        --ink-blue: #26344f;
        --quiet-blue: #6f7890;
        --strawberry: #ef879a;
        --sprout: #78aa80;
        --sunny: #f2c969;
        --paper-shadow: rgba(55, 66, 93, 0.12);
        --display: "Kaiti SC", "STKaiti", "KaiTi", serif;
        --body: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
        --utility: "SFMono-Regular", "Cascadia Code", "Roboto Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--milk-paper);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(rgba(111, 120, 144, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(111, 120, 144, 0.055) 1px, transparent 1px),
          var(--milk-paper);
        background-size: 28px 28px;
        color: var(--ink-blue);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 18rem;
        height: 18rem;
        border-radius: 50%;
        content: "";
        opacity: 0.2;
        pointer-events: none;
      }

      body::before {
        top: -8rem;
        right: -5rem;
        background: var(--strawberry);
      }

      body::after {
        bottom: -10rem;
        left: -7rem;
        background: var(--sprout);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--sunny);
        outline-offset: 5px;
      }

      .page {
        display: grid;
        width: min(100% - clamp(2rem, 8vw, 8rem), 1180px);
        min-height: 100vh;
        margin: 0 auto;
        grid-template-rows: auto 1fr auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: clamp(1.4rem, 4vw, 2.5rem) 0;
        border-bottom: 1px dashed color-mix(in srgb, var(--quiet-blue) 42%, transparent);
      }

      .brand {
        font-family: var(--display);
        font-size: clamp(1.25rem, 2.3vw, 1.65rem);
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .where {
        color: var(--quiet-blue);
        font-family: var(--utility);
        font-size: 0.7rem;
        letter-spacing: 0.08em;
      }

      main {
        display: grid;
        place-items: center;
        padding: clamp(4rem, 10vw, 8rem) 0;
      }

      .lost-note {
        position: relative;
        width: min(100%, 42rem);
        border: 1px solid rgba(111, 120, 144, 0.22);
        padding: clamp(3rem, 8vw, 6rem) clamp(1.5rem, 7vw, 5rem);
        background:
          repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 2.15rem,
            rgba(111, 120, 144, 0.1) 2.15rem,
            rgba(111, 120, 144, 0.1) calc(2.15rem + 1px)
          ),
          var(--clean-paper);
        box-shadow: 0.8rem 1rem 2.3rem var(--paper-shadow);
        text-align: center;
        transform: rotate(-0.5deg);
        animation: arrive 650ms cubic-bezier(0.2, 0.75, 0.2, 1) both;
      }

      .lost-note::before {
        position: absolute;
        top: -1rem;
        left: 50%;
        width: 7rem;
        height: 2rem;
        background: color-mix(in srgb, var(--sunny) 64%, transparent);
        content: "";
        transform: translateX(-50%) rotate(1.5deg);
        clip-path: polygon(3% 10%, 96% 0, 100% 88%, 4% 100%);
      }

      .error-code {
        position: relative;
        display: inline-block;
        margin: 0;
        color: var(--strawberry);
        font-family: var(--display);
        font-size: clamp(6.5rem, 22vw, 12rem);
        font-weight: 700;
        letter-spacing: -0.08em;
        line-height: 0.8;
      }

      .error-code::after {
        position: absolute;
        right: 0;
        bottom: -0.12em;
        left: 0.08em;
        height: 0.08em;
        border-radius: 50%;
        background: var(--sunny);
        content: "";
        opacity: 0.75;
        transform: rotate(-2deg);
      }

      h1 {
        margin: clamp(2rem, 5vw, 3rem) 0 0;
        font-family: var(--display);
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.25;
      }

      .explain {
        max-width: 30rem;
        margin: 1.35rem auto 0;
        color: var(--quiet-blue);
        font-size: 1rem;
        line-height: 1.9;
      }

      .back-home {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        margin-top: 2rem;
        border: 1px solid var(--ink-blue);
        padding: 0.78rem 1.15rem;
        background: var(--ink-blue);
        color: var(--clean-paper);
        font-size: 0.88rem;
        font-weight: 600;
        box-shadow: 4px 4px 0 var(--sunny);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .back-home:hover {
        box-shadow: 2px 2px 0 var(--sunny);
        transform: translate(2px, 2px);
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 0 2rem;
        border-top: 1px dashed color-mix(in srgb, var(--quiet-blue) 42%, transparent);
        color: var(--quiet-blue);
        font-size: 0.75rem;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(1.4rem) rotate(-1.5deg);
        }
        to {
          opacity: 1;
          transform: translateY(0) rotate(-0.5deg);
        }
      }

      @media (max-width: 620px) {
        .page {
          width: min(100% - 2rem, 42rem);
        }

        .topbar,
        .footer {
          align-items: flex-start;
          flex-direction: column;
        }

        .topbar {
          gap: 0.5rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="返回eric的开发日记首页">eric的开发日记</a>
        <span class="where">PAGE NOT FOUND</span>
      </header>

      <main>
        <section class="lost-note" aria-labelledby="lost-title">
          <p class="error-code" aria-hidden="true">404</p>
          <h1 id="lost-title">这一页偷偷溜走了。</h1>
          <p class="explain">地址可能写错了，或者这张日记纸还没有写好。回到首页，继续看看今天留下的记录吧。</p>
          <a class="back-home" href="/">回到开发日记 <span aria-hidden="true">→</span></a>
        </section>
      </main>

      <footer class="footer">
        <a href="https://beian.miit.gov.cn/" rel="noreferrer">桂ICP备2024032728号</a>
        <span>© <span id="current-year">2026</span> eric · 写代码，也写日记</span>
      </footer>
    </div>

    <script>
      document.querySelector("#current-year").textContent = new Date().getFullYear()
    </script>
  </body>
</html>
