<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffaf1" />
    <title>eric的开发日记</title>
    <meta
      name="description"
      content="eric的开发日记，一点点写代码，也一点点记录正在发生的想法。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:title" content="eric的开发日记" />
    <meta
      property="og:description"
      content="一点点写代码，也一点点记录正在发生的想法。"
    />
    <meta property="og:url" content="https://ericdocmic.top/" />
    <style>
      :root {
        color-scheme: light;
        --milk-paper: #fffaf1;
        --clean-paper: #fffefb;
        --ink-blue: #26344f;
        --quiet-blue: #6f7890;
        --strawberry: #ef879a;
        --sprout: #78aa80;
        --sunny: #f2c969;
        --pencil-line: #dce0e8;
        --paper-shadow: rgba(55, 66, 93, 0.12);
        --display: "Kaiti SC", "STKaiti", "KaiTi", serif;
        --body: "Avenir Next", "PingFang SC", "Hiragino Sans GB", sans-serif;
        --utility: "SFMono-Regular", "Cascadia Code", "Roboto Mono", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        scroll-behavior: smooth;
        background: var(--milk-paper);
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        background:
          linear-gradient(rgba(111, 120, 144, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(111, 120, 144, 0.055) 1px, transparent 1px),
          var(--milk-paper);
        background-size: 28px 28px;
        color: var(--ink-blue);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 18rem;
        height: 18rem;
        border-radius: 50%;
        content: "";
        filter: blur(1px);
        opacity: 0.2;
        pointer-events: none;
      }

      body::before {
        top: -8rem;
        right: -5rem;
        background: var(--strawberry);
      }

      body::after {
        bottom: -10rem;
        left: -7rem;
        background: var(--sprout);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--sunny);
        outline-offset: 5px;
      }

      .page {
        display: grid;
        width: min(100% - clamp(2rem, 8vw, 8rem), 1180px);
        min-height: 100vh;
        margin: 0 auto;
        grid-template-rows: auto 1fr auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: clamp(1.4rem, 4vw, 2.5rem) 0;
        border-bottom: 1px dashed color-mix(in srgb, var(--quiet-blue) 42%, transparent);
      }

      .brand {
        font-family: var(--display);
        font-size: clamp(1.25rem, 2.3vw, 1.65rem);
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .live-status {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        color: var(--quiet-blue);
        font-family: var(--utility);
        font-size: 0.7rem;
        letter-spacing: 0.04em;
      }

      .live-status::before {
        width: 0.55rem;
        height: 0.55rem;
        border: 2px solid var(--clean-paper);
        border-radius: 50%;
        background: var(--sprout);
        box-shadow: 0 0 0 1px var(--sprout);
        content: "";
      }

      main {
        display: grid;
        align-items: center;
        gap: clamp(3rem, 8vw, 7rem);
        grid-template-columns: minmax(0, 0.92fr) minmax(20rem, 0.78fr);
        padding: clamp(4.5rem, 10vw, 8rem) 0;
      }

      .intro {
        animation: arrive 650ms cubic-bezier(0.2, 0.75, 0.2, 1) both;
      }

      .eyebrow {
        display: inline-block;
        margin: 0 0 1.5rem;
        color: var(--strawberry);
        font-family: var(--utility);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 9ch;
        margin: 0;
        font-family: var(--display);
        font-size: clamp(3.4rem, 8.5vw, 7.25rem);
        font-weight: 700;
        letter-spacing: -0.065em;
        line-height: 0.98;
      }

      h1 em {
        position: relative;
        isolation: isolate;
        color: var(--sprout);
        font-style: normal;
        white-space: nowrap;
      }

      h1 em::after {
        position: absolute;
        right: 0.04em;
        bottom: -0.02em;
        left: 0.04em;
        height: 0.14em;
        border-radius: 50%;
        background: var(--sunny);
        content: "";
        opacity: 0.72;
        transform: rotate(-2deg);
        transform-origin: left;
        z-index: -1;
      }

      .lead {
        max-width: 32rem;
        margin: clamp(1.7rem, 4vw, 2.4rem) 0 0;
        color: var(--quiet-blue);
        font-size: clamp(1.05rem, 1.8vw, 1.3rem);
        line-height: 1.9;
      }

      .open-note {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin-top: 2rem;
        border-bottom: 1px solid var(--ink-blue);
        padding: 0 0 0.34rem;
        font-size: 0.9rem;
        font-weight: 600;
        transition: color 180ms ease, gap 180ms ease;
      }

      .open-note:hover {
        gap: 0.95rem;
        color: var(--strawberry);
      }

      .note-wrap {
        position: relative;
        animation: note-arrive 750ms 120ms cubic-bezier(0.2, 0.75, 0.2, 1) both;
      }

      .note-wrap::before {
        position: absolute;
        top: -1.05rem;
        left: 50%;
        z-index: 2;
        width: 7rem;
        height: 2.1rem;
        background: color-mix(in srgb, var(--sunny) 64%, transparent);
        content: "";
        transform: translateX(-50%) rotate(1.5deg);
        clip-path: polygon(3% 10%, 96% 0, 100% 88%, 4% 100%);
      }

      .note {
        position: relative;
        overflow: hidden;
        min-height: 30rem;
        border: 1px solid rgba(111, 120, 144, 0.22);
        padding: clamp(2.4rem, 5vw, 4rem);
        background:
          repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 2.15rem,
            rgba(111, 120, 144, 0.1) 2.15rem,
            rgba(111, 120, 144, 0.1) calc(2.15rem + 1px)
          ),
          var(--clean-paper);
        box-shadow: 0.8rem 1rem 2.3rem var(--paper-shadow);
        transform: rotate(0.75deg);
      }

      .note::after {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 3.8rem;
        height: 3.8rem;
        border-top: 1px solid rgba(111, 120, 144, 0.18);
        border-left: 1px solid rgba(111, 120, 144, 0.18);
        background: linear-gradient(135deg, #f1ecdf 0 49%, var(--milk-paper) 50% 100%);
        content: "";
        transform-origin: bottom right;
        transition: transform 220ms ease;
      }

      .note:hover::after {
        transform: scale(1.12);
      }

      .note-date {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: clamp(3rem, 7vw, 5rem);
        color: var(--quiet-blue);
        font-family: var(--utility);
        font-size: 0.72rem;
        letter-spacing: 0.05em;
      }

      .note-date::after {
        width: 2.4rem;
        height: 0.5rem;
        border-radius: 48% 52% 43% 57%;
        background: var(--strawberry);
        content: "";
        opacity: 0.72;
        transform: rotate(-5deg);
      }

      h2 {
        max-width: 11ch;
        margin: 0;
        font-family: var(--display);
        font-size: clamp(2rem, 4.8vw, 3.35rem);
        line-height: 1.35;
      }

      .note-copy {
        margin: 2rem 0 0;
        color: var(--quiet-blue);
        font-size: 1rem;
        line-height: 2.15;
      }

      .note-signoff {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 2.6rem;
        color: var(--sprout);
        font-family: var(--display);
        font-size: 1.05rem;
        font-weight: 700;
      }

      .note-signoff::before {
        width: 1.9rem;
        height: 1px;
        background: currentColor;
        content: "";
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 0 2rem;
        border-top: 1px dashed color-mix(in srgb, var(--quiet-blue) 42%, transparent);
        color: var(--quiet-blue);
        font-size: 0.75rem;
      }

      .footer a {
        transition: color 180ms ease;
      }

      .footer a:hover {
        color: var(--ink-blue);
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(1.2rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes note-arrive {
        from {
          opacity: 0;
          transform: translateY(1.6rem) rotate(-1deg);
        }
        to {
          opacity: 1;
          transform: translateY(0) rotate(0);
        }
      }

      @media (max-width: 820px) {
        .page {
          width: min(100% - 2rem, 42rem);
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.55rem;
        }

        main {
          grid-template-columns: 1fr;
          padding: 4.5rem 0 5.5rem;
        }

        h1 {
          max-width: 8ch;
        }

        .note {
          min-height: 27rem;
          padding: 3rem 2rem;
          transform: rotate(0.35deg);
        }

        .note-date {
          margin-bottom: 3rem;
        }

        .footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (max-width: 380px) {
        h1 {
          font-size: 3rem;
        }

        .note {
          padding: 2.8rem 1.4rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="eric的开发日记首页">eric的开发日记</a>
        <span class="live-status">慢慢写，持续更新</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="main-title">
          <p class="eyebrow">Eric's tiny dev log</p>
          <h1 id="main-title">今天也在，认真做一点<em>小东西</em>。</h1>
          <p class="lead">
            这里是 eric 的一页开发日记。写下敲过的代码、绕过的弯路，以及偶尔冒出来的小想法。
          </p>
          <a class="open-note" href="#today">翻开今天这页 <span aria-hidden="true">↓</span></a>
        </section>

        <div class="note-wrap" id="today">
          <article class="note" aria-labelledby="note-title">
            <div class="note-date">
              <time id="today-date" datetime="2026-07-21">2026.07.21 / TUE</time>
            </div>
            <h2 id="note-title">先把复杂的事，变简单一点。</h2>
            <p class="note-copy">
              写代码有点像整理桌面：留住真正需要的，收起暂时用不到的。今天把这里变成了一张安静的小纸片，之后的想法，就从这一页慢慢长出来。
            </p>
            <p class="note-signoff">今天也有一点点进展</p>
          </article>
        </div>
      </main>

      <footer class="footer">
        <a href="https://beian.miit.gov.cn/" rel="noreferrer">桂ICP备2024032728号</a>
        <span>© <span id="current-year">2026</span> eric · 写代码，也写日记</span>
      </footer>
    </div>

    <script>
      const now = new Date()
      const week = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"]
      const pad = (value) => String(value).padStart(2, "0")
      const dateText = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} / ${week[now.getDay()]}`
      const machineDate = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`
      const dateElement = document.querySelector("#today-date")

      dateElement.textContent = dateText
      dateElement.dateTime = machineDate
      document.querySelector("#current-year").textContent = now.getFullYear()
    </script>
  </body>
</html>
